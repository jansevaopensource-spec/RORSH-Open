name: Deploy SecureCom.js

on:
  push:
    branches: [ RORSH-Com ]
    paths:
      - 'SecureCom.js/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: RORSH-Com

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: ./SecureCom.js
      run: npm ci

    - name: Run tests
      working-directory: ./SecureCom.js
      run: npm test || echo "No tests configured"

    - name: Create deployment package
      working-directory: ./SecureCom.js
      run: |
        mkdir -p deploy
        cp package.json server.js deploy/
        cp .env.example deploy/
        tar -czf securecom-deploy.tar.gz deploy/

    - name: Upload deployment artifact
      uses: actions/upload-artifact@v4
      with:
        name: securecom-server
        path: SecureCom.js/securecom-deploy.tar.gz
