name: Build RCS (Client Shell)

on:
  push:
    branches: [main, master, RORSH-Com]
  pull_request:
    branches: [main, master, RORSH-Com]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows x64
        run: |
          cd RCS/RORSHClient
          dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: rcs-windows
          path: RCS/RORSHClient/bin/Release/net8.0/win-x64/publish/RORSHClient.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: rcs-windows-installer
          path: installer/install-rcs.ps1

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Linux x64
        run: |
          cd RCS/RORSHClient
          dotnet publish -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: rcs-linux
          path: RCS/RORSHClient/bin/Release/net8.0/linux-x64/publish/RORSHClient

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: rcs-linux-installer
          path: installer/install-rcs.sh

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Linux ARM64
        run: |
          cd RCS/RORSHClient
          dotnet publish -c Release -r linux-arm64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false

      - name: Upload Linux ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: rcs-linux-arm64
          path: RCS/RORSHClient/bin/Release/net8.0/linux-arm64/publish/RORSHClient
