name: Build RAS (Admin Shell)

on:
  push:
    branches: [main, master, RORSH-Com]
  pull_request:
    branches: [main, master, RORSH-Com]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows x64
        run: |
          cd RAS/RORSHTerminal
          dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ras-windows
          path: RAS/RORSHTerminal/bin/Release/net8.0/win-x64/publish/RORSHTerminal.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Linux x64
        run: |
          cd RAS/RORSHTerminal
          dotnet publish -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ras-linux
          path: RAS/RORSHTerminal/bin/Release/net8.0/linux-x64/publish/RORSHTerminal

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Linux ARM64
        run: |
          cd RAS/RORSHTerminal
          dotnet publish -c Release -r linux-arm64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ras-linux-arm64
          path: RAS/RORSHTerminal/bin/Release/net8.0/linux-arm64/publish/RORSHTerminal
