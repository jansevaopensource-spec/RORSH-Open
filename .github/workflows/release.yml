name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build RAS Windows
        run: |
          cd RAS/RORSHTerminal
          dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false
          mv bin/Release/net8.0/win-x64/publish/RORSHTerminal.exe ../../RORSHTerminal-win-x64.exe

      - name: Build RAS Linux
        run: |
          cd RAS/RORSHTerminal
          dotnet publish -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false
          mv bin/Release/net8.0/linux-x64/publish/RORSHTerminal ../../RORSHTerminal-linux-x64
          chmod +x ../../RORSHTerminal-linux-x64

      - name: Build RCS Windows
        run: |
          cd RCS/RORSHClient
          dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false
          mv bin/Release/net8.0/win-x64/publish/RORSHClient.exe ../../RORSHClient-win-x64.exe

      - name: Build RCS Linux
        run: |
          cd RCS/RORSHClient
          dotnet publish -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false
          mv bin/Release/net8.0/linux-x64/publish/RORSHClient ../../RORSHClient-linux-x64
          chmod +x ../../RORSHClient-linux-x64

      - name: Create Release Archives
        run: |
          mkdir -p release/ras release/rcs
          cp RORSHTerminal-win-x64.exe RAS/install/install-ras.ps1 release/ras/
          cp RORSHTerminal-linux-x64 RAS/install/install-ras.sh release/ras/
          cp RORSHClient-win-x64.exe RCS/install/install-rcs.ps1 release/rcs/
          cp RORSHClient-linux-x64 RCS/install/install-rcs.sh release/rcs/

          cd release
          zip -r ../RAS-${{ github.ref_name }}.zip ras/
          zip -r ../RCS-${{ github.ref_name }}.zip rcs/
          tar -czf ../RAS-${{ github.ref_name }}.tar.gz ras/
          tar -czf ../RCS-${{ github.ref_name }}.tar.gz rcs/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            RORSHTerminal-win-x64.exe
            RORSHTerminal-linux-x64
            RORSHClient-win-x64.exe
            RORSHClient-linux-x64
            RAS-*.zip
            RAS-*.tar.gz
            RCS-*.zip
            RCS-*.tar.gz
          body: |
            RORSH ${{ github.ref_name }} Release

            ## Downloads

            ### Admin Shell (RAS)
            - Windows: `RORSHTerminal-win-x64.exe` + `install-ras.ps1`
            - Linux: `RORSHTerminal-linux-x64` + `install-ras.sh`

            ### Client Shell (RCS)
            - Windows: `RORSHClient-win-x64.exe` + `install-rcs.ps1`
            - Linux: `RORSHClient-linux-x64` + `install-rcs.sh`

            ## Installation

            ### Windows (Admin)
            1. Download `RORSHTerminal-win-x64.exe` and `install-ras.ps1`
            2. Run PowerShell as Administrator
            3. Execute: `.\install-ras.ps1`

            ### Windows (Client)
            1. Download `RORSHClient-win-x64.exe` and `install-rcs.ps1`
            2. Run PowerShell as Administrator
            3. Execute: `.\install-rcs.ps1`

            ### Linux (Admin)
            ```bash
            chmod +x RORSHTerminal-linux-x64 install-ras.sh
            sudo bash install-ras.sh
            ```

            ### Linux (Client)
            ```bash
            chmod +x RORSHClient-linux-x64 install-rcs.sh
            sudo bash install-rcs.sh
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
