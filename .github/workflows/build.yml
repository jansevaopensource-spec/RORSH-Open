name: Build RORSH-Gate Client

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore client/RorshGate.csproj

      - name: Build
        run: dotnet build client/RorshGate.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        run: |
          dotnet publish client/RorshGate.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output ./publish/win-x64 `
            /p:PublishSingleFile=true `
            /p:PublishTrimmed=false `
            /p:InvariantGlobalization=true

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = Get-FileHash -Path "./publish/win-x64/rorsh-gate.exe" -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "./publish/win-x64/rorsh-gate.exe.sha256"
          Write-Output "SHA-256: $($hash.Hash)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rorsh-gate-win-x64
          path: ./publish/win-x64/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore client/RorshGate.csproj

      - name: Build
        run: dotnet build client/RorshGate.csproj --configuration Release --no-restore

      - name: Publish Linux x64
        run: |
          dotnet publish client/RorshGate.csproj             --configuration Release             --runtime linux-x64             --self-contained true             --output ./publish/linux-x64             /p:PublishSingleFile=true             /p:PublishTrimmed=false             /p:InvariantGlobalization=true

      - name: Compute SHA-256
        run: |
          sha256sum ./publish/linux-x64/rorsh-gate > ./publish/linux-x64/rorsh-gate.sha256
          cat ./publish/linux-x64/rorsh-gate.sha256

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rorsh-gate-linux-x64
          path: ./publish/linux-x64/

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: rorsh-gate-win-x64
          path: ./artifacts/win-x64/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: rorsh-gate-linux-x64
          path: ./artifacts/linux-x64/

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: Auto-generated release from latest commit
          files: |
            ./artifacts/win-x64/rorsh-gate.exe
            ./artifacts/win-x64/rorsh-gate.exe.sha256
            ./artifacts/linux-x64/rorsh-gate
            ./artifacts/linux-x64/rorsh-gate.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
