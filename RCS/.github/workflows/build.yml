name: Build and Release RCS

on:
  push:
    branches: [ RORSH-Com ]
    paths:
      - 'RCS/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: ""
          - os: windows-latest
            rid: win-x64
            ext: ".exe"

    steps:
    - uses: actions/checkout@v4
      with:
        ref: RORSH-Com

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      working-directory: ./RCS
      run: dotnet restore

    - name: Build
      working-directory: ./RCS
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      working-directory: ./RCS
      run: dotnet publish --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rcs-${{ matrix.rid }}
        path: RCS/publish/RCS${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/RORSH-Com'

    steps:
    - uses: actions/checkout@v4
      with:
        ref: RORSH-Com

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: rcs-v${{ github.run_number }}
        name: RCS Release v${{ github.run_number }}
        files: |
          artifacts/rcs-linux-x64/RCS
          artifacts/rcs-win-x64/RCS.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
